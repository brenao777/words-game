<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10141f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f2b64b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2310141f'/%3E%3C/svg%3E">
<title>Словокруг</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <section id="home" class="screen">
    <header class="home-head">
      <div class="home-top">
        <div class="coins-pill" id="home-coins"><i class="coin"></i><b>0</b></div>
        <button class="icon-btn" id="home-sound" aria-label="Выключить звук" aria-pressed="true"></button>
      </div>
      <h1 class="logo">СЛОВО<span>КРУГ</span></h1>
      <p class="tagline">собери все слова из букв</p>
      <p class="progress" id="home-progress"></p>
    </header>
    <div class="levels" id="levels"></div>
  </section>

  <!-- ИГРОВОЙ ЭКРАН -->
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btn-back" aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="lvl-meta">
        <div class="lvl-title" id="lvl-title">Уровень 1</div>
        <div class="lvl-progress-row">
          <span class="lvl-progress" id="lvl-progress" role="status" aria-live="polite" aria-atomic="true">0 / 0 слов</span>
          <span class="lvl-progress-track" aria-hidden="true"><i id="lvl-progress-fill"></i></span>
        </div>
      </div>
      <div class="coins-pill small" id="game-coins" role="status" aria-live="polite" aria-atomic="true" aria-label="Баланс: 0 монет"><i class="coin"></i><b>0</b></div>
      <div class="combo-indicator" id="combo-indicator" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <button class="icon-btn" id="btn-sound" aria-label="Выключить звук" aria-pressed="true"></button>
    </header>

    <div class="grid-wrap" id="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>

    <!-- Тултип значения слова -->
    <div class="word-tooltip" id="word-tooltip" role="tooltip" aria-live="polite" hidden>
      <button class="tooltip-close" aria-label="Закрыть">×</button>
      <div class="tooltip-word"></div>
      <div class="tooltip-def"></div>
    </div>

    <div class="preview-row">
      <button class="bonus-chip" id="bonus-chip" aria-label="Бонусных слов: 0" hidden><span class="star">✦</span><b>0</b></button>
      <div class="preview" id="preview" role="status" aria-live="polite" aria-atomic="true" aria-label="Слово не набрано"></div>
    </div>

    <div class="wheel-zone">
      <div id="coach-tip" role="note" aria-live="polite" aria-atomic="true" hidden>Веди пальцем по буквам</div>
      <button class="hint-btn" id="hint-lamp" aria-label="Открыть случайную букву за 25 монет" aria-disabled="false">
        <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.55 1.1 1.2 1.27 2.2h4.66c.17-1 .57-1.65 1.27-2.2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19h4M10.7 21.5h2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="cost">25</span>
      </button>
      <div class="wheel-box" id="wheel-box">
        <svg id="trace"></svg>
        <div id="coach-hand" aria-hidden="true" hidden></div>
        <button class="shuffle" id="btn-shuffle" aria-label="Перемешать">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.6-5.7M20 12a8 8 0 0 1-13.6 5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.8 2.6v4h-4M6.2 21.4v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="hint-btn" id="hint-target" aria-label="Выбрать букву для открытия за 50 монет" aria-disabled="false" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 1.8v3.4M12 18.8v3.4M1.8 12h3.4M18.8 12h3.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="cost">50</span>
      </button>
    </div>
  </section>

  <!-- ОВЕРЛЕЙ ПОБЕДЫ -->
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title" aria-describedby="ov-stats" hidden>
    <div class="overlay-pulse"></div>
    <div class="overlay-card">
      <div class="overlay-kicker" id="ov-kicker">уровень пройден</div>
      <div class="overlay-title" id="ov-title">Отлично!</div>
      <div class="overlay-stats" id="ov-stats"></div>
      <div class="overlay-actions">
        <button class="btn ghost" id="ov-home">К уровням</button>
        <button class="btn gold" id="ov-next">Дальше</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <div class="fx-layer" id="fx" aria-hidden="true"></div>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <div id="rotate"><div><div class="ico">⟳</div>Поверните устройство<br>вертикально</div></div>
</div>

<script src="js/levels.data.js"></script>
<script src="js/dictionary.js"></script>
<script src="js/definitions.js"></script>
<script src="js/audio.js"></script>
<script src="js/storage.js"></script>
<script src="js/particles.js"></script>
<script src="js/combo.js"></script>
<script src="js/wheel.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
