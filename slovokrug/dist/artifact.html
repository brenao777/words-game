<title>Словокруг</title>
<style>
/* ============ СЛОВОКРУГ — «Ночное золото» ============ */

:root {
  --bg: #10141f;
  --bg2: #181e30;
  --ink: #eef1f8;
  --muted: #8b93ad;
  --faint: rgba(255, 255, 255, .055);
  --line: rgba(255, 255, 255, .09);
  --gold: #f2b64b;
  --gold-hi: #ffd782;
  --gold-dim: rgba(242, 182, 75, .16);
  --tile: #f5f0e4;
  --tile-ink: #1c2233;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease: cubic-bezier(.22, .8, .36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

[hidden] { display: none !important; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 2px solid var(--gold-hi);
  outline-offset: 3px;
}

#app {
  position: relative;
  height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  overflow: hidden;
  background:
    radial-gradient(120% 55% at 50% 112%, rgba(242, 182, 75, .07), transparent 60%),
    radial-gradient(90% 60% at 50% -8%, #1b2238 0%, transparent 62%),
    linear-gradient(var(--bg), var(--bg2));
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom, 0px) + 10px);
  animation: screen-in .34s var(--ease);
}

@keyframes screen-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* ============ Общие элементы ============ */

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--faint);
  border: 1px solid var(--line);
  transition: transform .15s var(--spring), color .2s;
}
.icon-btn:active { transform: scale(.88); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.on { color: var(--gold); }

.coins-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px 8px 10px;
  border-radius: 999px;
  background: var(--faint);
  border: 1px solid var(--line);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
}

/* ---- комбо-индикатор ---- */

.combo-indicator {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(242, 182, 75, .12);
  border: 1px solid rgba(242, 182, 75, .3);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: .06em;
  color: var(--gold-hi);
  white-space: nowrap;
  animation: combo-breathe 0.8s ease-in-out infinite;
}
.combo-indicator b {
  font-variant-numeric: tabular-nums;
  color: var(--gold);
}
.combo-indicator.combo-pop {
  animation: none;
}
.combo-indicator.combo-pop b {
  animation: combo-num-pop 0.5s var(--spring);
}

@keyframes combo-breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(242, 182, 75, .15); }
  50%      { transform: scale(1.06); box-shadow: 0 0 16px rgba(242, 182, 75, .3); }
}

@keyframes combo-num-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.55); }
  100% { transform: scale(1); }
}

/* ---- canvas частиц ---- */

#particles-canvas {
  position: absolute;
  inset: 0;
  z-index: 51;
  pointer-events: none;
}
.coins-pill.small { padding: 6px 12px 6px 9px; font-size: 14px; }
.coins-pill.bump b { animation: bump .4s var(--spring); display: inline-block; }
.coins-pill.rewarding {
  border-color: rgba(242, 182, 75, .5);
  box-shadow: 0 0 18px rgba(242, 182, 75, .14);
}
@keyframes bump { 40% { transform: scale(1.35); color: var(--gold-hi); } }

i.coin {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, var(--gold-hi), var(--gold) 58%, #b97f22);
  box-shadow: 0 0 8px rgba(242, 182, 75, .55);
  flex: none;
}

/* ============ Главный экран ============ */

.home-head { text-align: center; padding: 4px 2px 12px; }

.home-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.logo {
  font-size: clamp(30px, 9vw, 40px);
  font-weight: 800;
  letter-spacing: .14em;
  line-height: 1;
}
.logo span { color: var(--gold); }

.tagline {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: .12em;
}

.progress {
  margin-top: 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--gold);
  opacity: .85;
}

.levels {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(10, 1fr);
  gap: 8px;
  padding: 4px 2px;
}

.lvl {
  position: relative;
  border-radius: 14px;
  background: var(--faint);
  border: 1px solid var(--line);
  color: var(--muted);
  font-weight: 700;
  font-size: clamp(13px, 4vw, 17px);
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  transition: transform .15s var(--spring), background .2s, color .2s;
}
.lvl:active { transform: scale(.9); }
.lvl.started { color: var(--ink); }
.lvl.started::after {
  content: "";
  position: absolute;
  bottom: 6px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold);
}
.lvl.done {
  background: linear-gradient(150deg, var(--gold-hi), var(--gold) 55%, #cf9333);
  border-color: transparent;
  color: #3a2c10;
  box-shadow: 0 4px 16px rgba(242, 182, 75, .22);
}
.lvl.done::after { display: none; }
.lvl-stars {
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: -1px;
  color: #3a2c10;
  white-space: nowrap;
}

/* ============ Игровой экран ============ */

#game { padding-left: 12px; padding-right: 12px; }

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 6px;
}
.lvl-meta {
  flex: 1;
  min-width: 0;
}
.lvl-title {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .06em;
}
.lvl-progress-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 4px;
  transform-origin: left center;
}
.lvl-progress-row.bump { animation: lvl-progress-bump .38s var(--spring); }
@keyframes lvl-progress-bump { 45% { transform: scale(1.06); } }
.lvl-progress {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: .04em;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.lvl-progress-track {
  flex: 1;
  max-width: 68px;
  height: 4px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, .08);
}
.lvl-progress-track i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--gold-hi));
  box-shadow: 0 0 8px rgba(242, 182, 75, .45);
  transition: width .38s var(--ease);
}

.grid-wrap {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 8px 0 4px;
}

.grid { position: relative; }

.cell {
  position: absolute;
  width: var(--cell);
  height: var(--cell);
  border-radius: calc(var(--cell) * .22);
  background: var(--faint);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: calc(var(--cell) * .52);
  color: var(--tile-ink);
  transition: box-shadow .25s;
}

.cell.open {
  background: linear-gradient(160deg, #fdf9ee, var(--tile) 60%, #e6dfc9);
  border-color: transparent;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .35);
  animation: cell-pop .5s var(--spring);
}
@keyframes cell-pop {
  0%   { transform: scale(.3) rotate(-8deg); opacity: 0; }
  60%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
  100% { transform: none; }
}

.cell.hinted { background: linear-gradient(160deg, var(--gold-hi), var(--gold) 70%); }

.cell.glow { animation: cell-glow .6s var(--ease); }
@keyframes cell-glow {
  30% { box-shadow: 0 0 18px 2px rgba(242, 182, 75, .8); transform: scale(1.08); }
}

.cell.target-mode { animation: target-pulse 1.1s ease-in-out infinite; cursor: pointer; }
@keyframes target-pulse {
  50% { background: var(--gold-dim); border-color: var(--gold); }
}

/* ---- превью слова ---- */

.preview-row {
  position: relative;
  height: 52px;
  display: grid;
  place-items: center;
}

.preview { display: flex; gap: 5px; }

.pv-tile {
  width: 34px;
  height: 38px;
  border-radius: 9px;
  background: var(--tile);
  color: var(--tile-ink);
  font-weight: 800;
  font-size: 20px;
  display: grid;
  place-items: center;
  animation: pv-in .22s var(--spring);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .3);
}
@keyframes pv-in {
  from { transform: scale(.4) translateY(8px); opacity: 0; }
}

.preview.long .pv-tile {
  width: 29px;
  height: 33px;
  font-size: 17px;
  border-radius: 8px;
}

.preview.shake { animation: shake .4s var(--ease); }
@keyframes shake {
  20% { transform: translateX(-8px); }
  45% { transform: translateX(7px); }
  70% { transform: translateX(-4px); }
  90% { transform: translateX(2px); }
}
.preview.dissolve .pv-tile { animation: pv-out .3s var(--ease) forwards; }
@keyframes pv-out {
  to { transform: scale(.5) translateY(6px); opacity: 0; }
}
.preview.absorb .pv-tile { animation: pv-up .32s var(--ease) forwards; }
@keyframes pv-up {
  to { transform: translateY(-18px) scale(.6); opacity: 0; }
}

.bonus-chip {
  position: absolute;
  left: 2px;
  top: 50%;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 11px;
  border-radius: 999px;
  background: var(--faint);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}
.bonus-chip .star { color: var(--gold); font-size: 12px; }
.bonus-chip.bump { animation: bump .4s var(--spring); }
.bonus-chip { transition: opacity .2s; }
.bonus-chip.faded { opacity: 0; pointer-events: none; }

/* ---- колесо ---- */

.wheel-zone {
  position: relative;
  display: grid;
  place-items: center;
  padding: 6px 0 4px;
}
#hint-lamp { position: absolute; left: 10px; top: 4px; }
#hint-target { position: absolute; right: 10px; top: 4px; }

/* ---- обучающая подсказка (первый запуск) ---- */
#coach-tip {
  position: absolute;
  top: 2px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  padding: 7px 15px;
  border-radius: 999px;
  background: rgba(29, 36, 56, .95);
  border: 1px solid rgba(242, 182, 75, .4);
  color: var(--gold-hi);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
  pointer-events: none;
  animation: coach-tip-in .4s var(--spring), coach-tip-breathe 2.2s var(--ease) .4s infinite;
}
@keyframes coach-tip-in { from { transform: translate(-50%, 8px) scale(.85); opacity: 0; } }
@keyframes coach-tip-breathe { 50% { transform: translate(-50%, -3px); } }

#coach-hand {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 5;
  width: 30px;
  height: 30px;
  margin: -15px 0 0 -15px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, rgba(255, 255, 255, .95), rgba(255, 215, 130, .85) 55%, rgba(242, 182, 75, .5));
  box-shadow: 0 0 0 6px rgba(242, 182, 75, .18), 0 2px 10px rgba(0, 0, 0, .4);
  pointer-events: none;
}

.wheel-box {
  position: relative;
  width: min(76vw, 310px);
  height: min(76vw, 310px);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .05), rgba(255, 255, 255, .015) 70%);
  border: 1px solid var(--line);
  flex: none;
}

#trace {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

.letter {
  position: absolute;
  width: var(--lsize, 60px);
  height: var(--lsize, 60px);
  margin: calc(var(--lsize, 60px) / -2) 0 0 calc(var(--lsize, 60px) / -2);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: calc(var(--lsize, 60px) * .46);
  color: var(--ink);
  background: rgba(255, 255, 255, .07);
  border: 1px solid var(--line);
  transition: transform .18s var(--spring), background .15s, color .15s, left .35s var(--spring), top .35s var(--spring);
  pointer-events: none;
}

.letter.picked {
  background: linear-gradient(160deg, var(--gold-hi), var(--gold) 65%);
  border-color: transparent;
  color: #3a2c10;
  transform: scale(1.18);
  box-shadow: 0 0 20px rgba(242, 182, 75, .5);
}

.shuffle {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--faint);
  border: 1px solid var(--line);
  transition: transform .3s var(--spring), color .2s;
}
.shuffle svg { width: 20px; height: 20px; }
.shuffle:active { transform: translate(-50%, -50%) scale(.85) rotate(120deg); color: var(--gold); }

.hint-btn {
  position: relative;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--gold);
  background: var(--gold-dim);
  border: 1px solid rgba(242, 182, 75, .3);
  transition: transform .15s var(--spring), opacity .2s;
  flex: none;
}
.hint-btn svg { width: 24px; height: 24px; }
.hint-btn:active { transform: scale(.88); }
.hint-btn.disabled { opacity: .35; }
.hint-btn.armed { animation: target-pulse 1.1s ease-in-out infinite; }
.hint-btn .cost {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 800;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg2);
  border: 1px solid rgba(242, 182, 75, .35);
  color: var(--gold-hi);
}
.hint-btn .cost::before {
  content: "";
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 5px rgba(242, 182, 75, .6);
}

/* ============ Оверлей победы ============ */

#overlay {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  background: rgba(10, 13, 22, .68);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: fade-in .3s var(--ease);
}
@keyframes fade-in { from { opacity: 0; } }

.overlay-pulse {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(242, 182, 75, .5), transparent 70%);
  animation: pulse-out 1.1s var(--ease) forwards;
  pointer-events: none;
}
@keyframes pulse-out {
  to { width: 150vmax; height: 150vmax; opacity: 0; }
}

.overlay-card {
  width: min(84vw, 340px);
  padding: 30px 26px 24px;
  border-radius: 26px;
  text-align: center;
  background: linear-gradient(170deg, #1d2438, #151a2b);
  border: 1px solid var(--line);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  animation: card-in .5s var(--spring);
}
@keyframes card-in {
  from { transform: scale(.7) translateY(30px); opacity: 0; }
}

.overlay-kicker {
  color: var(--gold);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .28em;
  text-transform: uppercase;
}
.overlay-title {
  font-size: 30px;
  font-weight: 800;
  margin: 10px 0 4px;
}
.overlay-stats {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  margin: 8px 0 20px;
}
.overlay-stats b { color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.overlay-stars { min-height: 35px; margin: 4px 0 2px; font-size: 29px; letter-spacing: 3px; }
.overlay-star { display: inline-block; color: rgba(255, 255, 255, .15); text-shadow: none; }
.overlay-star.earned { color: var(--gold-hi); text-shadow: 0 0 16px rgba(242, 182, 75, .6); animation: star-pop .52s var(--spring) var(--star-delay) both; }
@keyframes star-pop { from { transform: scale(.25) rotate(-18deg); opacity: 0; } 65% { transform: scale(1.25) rotate(5deg); } to { transform: none; opacity: 1; } }
.overlay-rewards { margin: 10px 0 20px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .045); border: 1px solid var(--line); text-align: left; color: var(--muted); font-size: 13px; line-height: 1.75; }
.overlay-rewards div { display: flex; justify-content: space-between; gap: 12px; }
.overlay-rewards b { color: var(--gold-hi); font-variant-numeric: tabular-nums; white-space: nowrap; }
.overlay-rewards .reward-total { margin-top: 4px; padding-top: 5px; border-top: 1px solid var(--line); color: var(--ink); font-weight: 700; }

.overlay-actions { display: flex; gap: 10px; }

.btn {
  flex: 1;
  padding: 14px 10px;
  border-radius: 15px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: .03em;
  transition: transform .15s var(--spring);
}
.btn:active { transform: scale(.93); }
.btn.gold {
  background: linear-gradient(150deg, var(--gold-hi), var(--gold) 55%, #cf9333);
  color: #3a2c10;
  box-shadow: 0 6px 18px rgba(242, 182, 75, .3);
}
.btn.ghost {
  background: var(--faint);
  border: 1px solid var(--line);
  color: var(--muted);
}

/* ============ Тост и эффекты ============ */

#toast {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
  transform: translateX(-50%);
  z-index: 40;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(29, 36, 56, .95);
  border: 1px solid var(--line);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  pointer-events: none;
  animation: toast-in .3s var(--spring);
}
#toast.gold { color: var(--gold-hi); border-color: rgba(242, 182, 75, .4); }
#toast.out { animation: toast-out .25s var(--ease) forwards; }
@keyframes toast-in { from { transform: translate(-50%, 14px) scale(.8); opacity: 0; } }
@keyframes toast-out { to { transform: translate(-50%, 8px); opacity: 0; } }

.fx-layer {
  position: absolute;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  overflow: hidden;
}

.fly-coin {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, var(--gold-hi), var(--gold) 58%, #b97f22);
  border: 1px solid rgba(255, 235, 174, .65);
  box-shadow: 0 0 10px rgba(242, 182, 75, .7);
  will-change: transform, opacity;
}

.fly-coin::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 1px solid rgba(116, 72, 13, .36);
}

.coin-reward {
  position: absolute;
  transform: translate(-50%, -50%);
  color: var(--gold-hi);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: .02em;
  text-shadow: 0 2px 8px rgba(0, 0, 0, .8), 0 0 14px rgba(242, 182, 75, .55);
  animation: coin-reward-rise .8s var(--spring) forwards;
}

@keyframes coin-reward-rise {
  0% { transform: translate(-50%, 8px) scale(.65); opacity: 0; }
  28% { transform: translate(-50%, -8px) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%, -34px) scale(.92); opacity: 0; }
}

@media (max-height: 700px) {
  .wheel-box { width: min(66vw, 250px); height: min(66vw, 250px); }
  .preview-row { height: 44px; }
  .home-head { padding-bottom: 6px; }
}

@media (hover: hover) and (pointer: fine) {
  .icon-btn:hover { color: var(--gold-hi); border-color: rgba(242, 182, 75, .28); }
  .lvl:hover { transform: translateY(-2px); border-color: rgba(242, 182, 75, .28); color: var(--ink); }
  .lvl.done:hover { color: #3a2c10; box-shadow: 0 7px 20px rgba(242, 182, 75, .3); }
  .shuffle:hover { transform: translate(-50%, -50%) rotate(12deg); color: var(--gold-hi); }
  .hint-btn:not(.disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(242, 182, 75, .13); }
  .btn:hover { transform: translateY(-2px); }
}

/* Игра портретная: в низком ландшафте показываем заглушку вместо сломанной раскладки. */
#rotate {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: none;
  place-items: center;
  text-align: center;
  background: var(--bg);
  color: var(--muted);
  font-size: 15px;
  letter-spacing: .05em;
}
#rotate .ico { font-size: 44px; color: var(--gold); margin-bottom: 12px; }
@media (orientation: landscape) and (max-height: 520px) {
  #rotate { display: grid !important; }
}

/* Доступность: уважаем системную настройку «меньше движения».
   Клетки/буквы/оверлей мгновенно принимают конечное состояние, бесконечные
   пульсации гаснут — игровая логика (раскрытие букв) сохраняется. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .overlay-pulse { display: none; }
}

/* ---- тултип значения слова ---- */

.word-tooltip {
  position: absolute;
  z-index: 60;
  max-width: 260px;
  padding: 14px 16px 12px;
  border-radius: 14px;
  background: linear-gradient(170deg, rgba(29, 36, 56, .84), rgba(21, 26, 43, .84));
  border: 1px solid rgba(242, 182, 75, .35);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .55), 0 0 0 1px rgba(242, 182, 75, .1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  transform: scale(.85) translateY(6px);
  pointer-events: none;
  transition: opacity .18s var(--ease), transform .18s var(--spring);
}

.word-tooltip.is-visible {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

.word-tooltip.is-hiding {
  opacity: 0;
  transform: scale(.9) translateY(4px);
  pointer-events: none;
}

.tooltip-word {
  font-weight: 800;
  font-size: 14px;
  letter-spacing: .08em;
  color: var(--gold-hi);
  text-transform: uppercase;
  margin-bottom: 6px;
  padding-right: 22px;
}

.tooltip-def {
  font-size: 13px;
  line-height: 1.55;
  color: var(--muted);
}

.tooltip-close {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.tooltip-close:active { color: var(--gold-hi); }

      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 24;
      comp.ratio.value = 6;
      master = ctx.createGain();
      master.gain.value = 0.85;
      master.connect(comp);
      comp.connect(ctx.destination);
    }
    if (ctx.state !== 'running') ctx.resume(); // suspended и iOS-состояние interrupted
    return true;
  }

  function now() { return ctx.currentTime; }

  /* Мягкий щипок: осциллятор -> lowpass -> огибающая. */
  function pluck(freq, t0, opt) {
    opt = opt || {};
    const t = now() + (t0 || 0);
    const osc = ctx.createOscillator();
    const flt = ctx.createBiquadFilter();
    const g = ctx.createGain();
    osc.type = opt.type || 'triangle';
    osc.frequency.value = freq;
    if (opt.glide) osc.frequency.exponentialRampToValueAtTime(opt.glide, t + (opt.dur || 0.18));
    flt.type = 'lowpass';
    flt.frequency.value = opt.cutoff || freq * 4;
    flt.Q.value = 0.7;
    const vol = opt.gain != null ? opt.gain : 0.4;
    const dur = opt.dur || 0.18;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(flt); flt.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  /* Искра: короткий шум через highpass. */
  function sparkle(t0, opt) {
    opt = opt || {};
    const t = now() + (t0 || 0);
    const dur = opt.dur || 0.25;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const flt = ctx.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.value = opt.hp || 5000;
    const g = ctx.createGain();
    g.gain.value = opt.gain != null ? opt.gain : 0.12;
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t);
  }

  /* Пентатоника до-мажор на две октавы — «пение» слова при выборе букв. */
  const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.26, 784.0, 880.0, 1046.5];

  function play(fn) {
    if (!enabled) return;
    if (!ensure()) return;
    try { fn(); } catch (e) { /* звук не должен ломать игру */ }
  }

  const SFX = {
    get enabled() { return enabled; },
    // контекст НЕ создаётся здесь: только по жесту пользователя (unlock/play)
    setEnabled(v) { enabled = !!v; },
    unlock() { if (enabled) ensure(); },

    pick(i) {
      play(() => {
        const f = PENTA[Math.min(i, PENTA.length - 1)];
        pluck(f, 0, { gain: 0.35, dur: 0.16 });
        pluck(f * 2, 0, { gain: 0.06, dur: 0.1, type: 'sine' });
      });
    },

    unpick(i) {
      play(() => pluck(PENTA[Math.max(0, Math.min(i, PENTA.length - 1))] * 0.5, 0, { gain: 0.18, dur: 0.1 }));
    },

    word(n) {
      play(() => {
        const steps = Math.min(2 + n, 6);
        for (let k = 0; k < steps; k++) {
          pluck(PENTA[2 + k], k * 0.055, { gain: 0.32, dur: 0.22 });
        }
        pluck(PENTA[2 + steps] * 2, steps * 0.055, { gain: 0.1, dur: 0.5, type: 'sine' });
        sparkle(steps * 0.055, { gain: 0.05, hp: 7000 });
      });
    },

    bonus() {
      play(() => {
        pluck(880, 0, { glide: 1568, gain: 0.22, dur: 0.22, type: 'sine', cutoff: 8000 });
        pluck(1318.5, 0.1, { gain: 0.18, dur: 0.3, type: 'sine' });
        sparkle(0.06, { gain: 0.1, hp: 6000, dur: 0.3 });
      });
    },

    coin(t0) {
      play(() => {
        pluck(1318.5, t0 || 0, { gain: 0.14, dur: 0.16, type: 'sine' });
        pluck(1760, (t0 || 0) + 0.07, { gain: 0.12, dur: 0.22, type: 'sine' });
      });
    },

    invalid() {
      play(() => {
        pluck(150, 0, { glide: 78, gain: 0.3, dur: 0.22, type: 'sawtooth', cutoff: 420 });
      });
    },

    dup() {
      play(() => {
        pluck(523, 0, { gain: 0.12, dur: 0.06 });
        pluck(523, 0.09, { gain: 0.12, dur: 0.06 });
      });
    },

    hint() {
      play(() => {
        pluck(659, 0, { gain: 0.2, dur: 0.14 });
        pluck(987, 0.08, { gain: 0.2, dur: 0.25, type: 'sine' });
        sparkle(0.05, { gain: 0.06 });
      });
    },

    click() {
      play(() => pluck(392, 0, { gain: 0.1, dur: 0.05 }));
    },

    win() {
      play(() => {
        const chords = [
          [261.63, 329.63, 392.0],
          [293.66, 392.0, 493.88],
          [329.63, 415.3, 523.25],
          [392.0, 493.88, 659.26, 783.99],
        ];
        chords.forEach((ch, i) => {
          ch.forEach(f => pluck(f, i * 0.16, { gain: 0.16, dur: i === chords.length - 1 ? 0.9 : 0.3 }));
        });
        sparkle(0.5, { gain: 0.08, dur: 0.5, hp: 5000 });
        pluck(1046.5, 0.64, { gain: 0.1, dur: 0.8, type: 'sine' });
      });
    },
  };

  window.SFX = SFX;

  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }
  window.HAPTIC = {
    tap() { buzz(8); },
    ok() { buzz([12, 30, 18]); },
    no() { buzz(40); },
  };
})();
</script>
<script>
/* Словокруг — прогресс в localStorage. */
(function () {
  'use strict';

  const KEY = 'slovokrug.v1';
  const DEFAULT_COINS = 100;

  let state = null;

  function defaults() {
    return {
      coins: DEFAULT_COINS,
      sound: true,
      seenIntro: false, // показывали ли обучающую подсказку про «веди по буквам»
      levels: {}, // { [idx]: { found: [], bonus: [], hinted: [], done: false } }
    };
  }

  function isRecord(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  function uniqueStrings(value, accept) {
    if (!Array.isArray(value)) return [];
    const seen = new Set();
    return value.filter(item => {
      if (typeof item !== 'string' || item.length === 0 || (accept && !accept(item)) || seen.has(item)) return false;
      seen.add(item);
      return true;
    });
  }

  function normalizeLevel(value) {
    const raw = isRecord(value) ? value : {};
    return {
      found: uniqueStrings(raw.found),
      bonus: uniqueStrings(raw.bonus),
      hinted: uniqueStrings(raw.hinted, item => /^\d+,\d+$/.test(item)),
      done: raw.done === true,
      // Старые сохранения восстанавливают звёзды по уже сохранённым подсказкам и бонусам.
      stars: raw.done === true
        ? (Number.isInteger(raw.stars) && raw.stars >= 1 && raw.stars <= 3 ? raw.stars : starsFor(raw))
        : 0,
    };
  }

  function normalizeState(value) {
    const next = defaults();
    if (!isRecord(value)) return next;

    if (Number.isFinite(value.coins) && value.coins >= 0) next.coins = Math.floor(value.coins);
    if (typeof value.sound === 'boolean') next.sound = value.sound;
    if (value.seenIntro === true) next.seenIntro = true;

    if (isRecord(value.levels)) {
      for (const [idx, levelState] of Object.entries(value.levels)) {
        if (/^(0|[1-9]\d*)$/.test(idx)) next.levels[idx] = normalizeLevel(levelState);
      }
    }
    return next;
  }

  function load() {
    if (state) return state;
    try {
      const raw = localStorage.getItem(KEY);
      state = normalizeState(raw ? JSON.parse(raw) : null);
    } catch (e) {
      state = defaults();
    }
    return state;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(load())); } catch (e) {}
  }

  function level(idx) {
    const s = load();
    if (!s.levels[idx]) s.levels[idx] = normalizeLevel(null);
    return s.levels[idx];
  }

  function starsFor(levelState) {
    const level = isRecord(levelState) ? levelState : {};
    const usedHint = Array.isArray(level.hinted) && level.hinted.length > 0;
    const foundBonus = Array.isArray(level.bonus) && level.bonus.length > 0;
    return 1 + (usedHint ? 0 : 1) + (foundBonus ? 1 : 0);
  }

  function refreshStars(levelState) {
    if (!isRecord(levelState) || levelState.done !== true) return;
    levelState.stars = starsFor(levelState);
    save();
  }

  window.Store = {
    get state() { return load(); },
    save,
    level,
    starsFor,
    refreshStars,
    addCoins(n) {
      if (!Number.isFinite(n)) return;
      const s = load();
      s.coins = Math.max(0, Math.floor(s.coins + n));
      save();
    },
    setSound(v) { load().sound = !!v; save(); },
    setIntroSeen() { load().seenIntro = true; save(); },
  };
})();
</script>
<script>
/* Словокруг — система частиц: шлейф, взрывы, красная вспышка.
 * Лёгкий canvas-движок на requestAnimationFrame, ≤ 30 частиц одновременно. */
(function () {
  'use strict';

  var MAX_PARTICLES = 30;
  var GRAVITY = 0.18;

  var Particles = {
    canvas: null,
    ctx: null,
    pool: [],
    raf: 0,
    running: false,
    reducedMotion: false,

    /* ---- инициализация ---- */

    init: function (canvas) {
      if (!canvas) return;
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      this._fit();
      var self = this;
      window.addEventListener('resize', function () { self._fit(); });
      this._start();
    },

    _fit: function () {
      if (!this.canvas) return;
      var app = document.querySelector('#app');
      if (!app) return;
      var w = app.clientWidth;
      var h = app.clientHeight;
      if (this.canvas.width !== w) this.canvas.width = w;
      if (this.canvas.height !== h) this.canvas.height = h;
    },

    /* ---- цикл ---- */

    _start: function () {
      if (this.running) return;
      this.running = true;
      var self = this;
      (function tick() {
        if (!self.running) return;
        self._update();
        self._draw();
        self.raf = requestAnimationFrame(tick);
      })();
    },

    _update: function () {
      var pool = this.pool;
      for (var i = pool.length - 1; i >= 0; i--) {
        var p = pool[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += GRAVITY;
        p.life--;
        p.size *= 0.982;
        if (p.life <= 0) pool.splice(i, 1);
      }
    },

    _draw: function () {
      var ctx = this.ctx;
      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      var pool = this.pool;
      for (var i = 0; i < pool.length; i++) {
        var p = pool[i];
        var alpha = Math.max(0, p.life / (p.maxLife || 30)) * p.alpha;
        if (alpha <= 0.01) continue;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        if (p.glow) {
          ctx.shadowColor = p.color;
          ctx.shadowBlur = p.glow * alpha;
          ctx.fill();
        }
        ctx.restore();
      }
    },

    /* ---- фабрика частиц ---- */

    _emit: function (p) {
      while (this.pool.length >= MAX_PARTICLES) {
        this.pool.shift();
      }
      this.pool.push(p);
    },

    /* ---- публичные эффекты ---- */

    /**
     * Золотой шлейф за пальцем при ведении по колесу.
     * Вызывается из Wheel._down / Wheel._move с координатами относительно #app.
     */
    trail: function (x, y) {
      if (this.reducedMotion) return;
      this._emit({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 0.9,
        vy: (Math.random() - 0.5) * 0.9 - 0.3,
        size: 1.2 + Math.random() * 2.0,
        life: 18 + Math.floor(Math.random() * 10),
        maxLife: 28,
        alpha: 0.7,
        color: '#f2b64b',
        glow: 3,
      });
    },

    /**
     * Взрыв золотых частиц из центра найденного слова.
     * count — количество частиц (обрежется до лимита).
     */
    burst: function (x, y, count) {
      if (this.reducedMotion) return;
      var n = Math.min(count || 10, MAX_PARTICLES - this.pool.length);
      if (n <= 0) return;
      for (var i = 0; i < n; i++) {
        var angle = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        var speed = 2.2 + Math.random() * 3.5;
        this._emit({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: 2.0 + Math.random() * 3.2,
          life: 22 + Math.floor(Math.random() * 16),
          maxLife: 38,
          alpha: 0.85,
          color: '#f2b64b',
          glow: 5,
        });
      }
    },

    /**
     * Красная вспышка при сбросе комбо.
     * Частицы разлетаются из центра экрана.
     */
    comboBreak: function () {
      if (this.reducedMotion) return;
      var cx = this.canvas.width / 2;
      var cy = this.canvas.height * 0.4;
      var n = Math.min(22, MAX_PARTICLES - this.pool.length);
      if (n <= 0) return;
      for (var i = 0; i < n; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 3.5 + Math.random() * 5.5;
        this._emit({
          x: cx + (Math.random() - 0.5) * 140,
          y: cy + (Math.random() - 0.5) * 70,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.5,
          size: 1.6 + Math.random() * 3.8,
          life: 16 + Math.floor(Math.random() * 14),
          maxLife: 30,
          alpha: 0.82,
          color: Math.random() > 0.35 ? '#ff3b30' : '#ff6b4a',
          glow: 5,
        });
      }
    },
  };

  window.Particles = Particles;
})();
</script>
<script>
/* Словокруг — комбо-система: множитель монет за серию правильных слов. */
(function () {
  'use strict';

  const $ = s => document.querySelector(s);

  // streak: 0 1 2 3+
  const MULTIPLIERS = [1, 2, 3, 5];

  const Combo = {
    streak: 0,
    multiplier: 1,
    el: null,
    popTimer: null,

    /** Привязать DOM-элемент (вызывается из Game.init). */
    init(el) {
      this.el = el;
    },

    /** Игрок нашёл слово — увеличиваем серию. */
    grow() {
      this.streak++;
      const prev = this.multiplier;
      this.multiplier = MULTIPLIERS[Math.min(this.streak, MULTIPLIERS.length - 1)];
      this._render(prev !== this.multiplier);
    },

    /** Невалидное слово — сброс серии. */
    reset() {
      if (this.streak === 0) return;
      const wasActive = this.multiplier > 1;
      this.streak = 0;
      this.multiplier = 1;
      this._render(false);
      if (wasActive && window.Particles) {
        window.Particles.comboBreak();
      }
    },

    /** Сброс при уходе с уровня / открытии нового. */
    levelReset() {
      this.streak = 0;
      this.multiplier = 1;
      this._render(false);
    },

    /* ---- внутреннее ---- */

    _render(grew) {
      if (!this.el) return;
      if (this.multiplier <= 1) {
        this.el.hidden = true;
        return;
      }
      this.el.hidden = false;
      this.el.innerHTML = '\u00D7<b>' + this.multiplier + '</b> \u041A\u041E\u041C\u0411\u041E';

      if (grew) {
        clearTimeout(this.popTimer);
        this.el.classList.remove('combo-pop');
        // force reflow для перезапуска анимации
        void this.el.offsetWidth;
        this.el.classList.add('combo-pop');
        this.popTimer = setTimeout(function () {
          Combo.el.classList.remove('combo-pop');
        }, 520);
      }
    },
  };

  window.Combo = Combo;
})();
</script>
<script>
/* Словокруг — колесо букв: pointer events, светящаяся линия, перемешивание. */
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';

  function Wheel(box, trace, callbacks) {
    this.box = box;
    this.trace = trace;
    this.cb = callbacks; // { onPick(i, word), onUnpick(i, word), onSubmit(word) }
    this.letters = [];   // { ch, el, x, y }
    this.picked = [];    // индексы
    this.pointerId = null;
    this.pos = null;

    box.addEventListener('pointerdown', e => this._down(e));
    box.addEventListener('pointermove', e => this._move(e));
    box.addEventListener('pointerup', e => this._up(e));
    box.addEventListener('pointercancel', e => this._up(e));
  }

  Wheel.prototype.setLetters = function (chars) {
    this.reset();
    this.letters.forEach(l => l.el.remove());
    this.letters = chars.map(ch => {
      const el = document.createElement('div');
      el.className = 'letter';
      el.textContent = ch.toUpperCase();
      this.box.appendChild(el);
      return { ch, el, x: 0, y: 0 };
    });
    this.order = this.letters.map((_, i) => i);
    this._size();
    this.layout(this.order);
  };

  Wheel.prototype._size = function () {
    const n = this.letters.length;
    const size = n >= 7 ? 0.185 : n === 6 ? 0.2 : 0.215;
    this.box.style.setProperty('--lsize', Math.round(this.box.clientWidth * size) + 'px');
  };

  /* Пересчитать размеры и позиции (после resize/поворота). */
  Wheel.prototype.refresh = function () {
    if (!this.letters.length) return;
    this._size();
    this.layout(this.order);
  };

  /* Расставить буквы по окружности (order — перестановка индексов). */
  Wheel.prototype.layout = function (order) {
    const n = this.letters.length;
    if (!order) order = this.letters.map((_, i) => i);
    this.order = order;
    const W = this.box.clientWidth;
    const R = W * 0.375;
    order.forEach((li, slot) => {
      const a = -Math.PI / 2 + slot * (2 * Math.PI / n);
      const l = this.letters[li];
      l.x = W / 2 + R * Math.cos(a);
      l.y = W / 2 + R * Math.sin(a);
      l.el.style.left = l.x + 'px';
      l.el.style.top = l.y + 'px';
    });
  };

  Wheel.prototype.shuffle = function () {
    const n = this.letters.length;
    const order = this.letters.map((_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
    this.layout(order);
  };

  Wheel.prototype.word = function () {
    return this.picked.map(i => this.letters[i].ch).join('');
  };

  Wheel.prototype.reset = function () {
    this.picked.forEach(i => this.letters[i].el.classList.remove('picked'));
    this.picked = [];
    this.pointerId = null;
    this.pos = null;
    this._draw();
  };

  Wheel.prototype._hit = function (e) {
    const r = this.box.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    this.pos = { x, y };
    const size = this.letters.length ? this.letters[0].el.offsetWidth : 60;
    let best = -1, bestD = size * 0.68; // радиус захвата: чуть больше видимого круга буквы
    this.letters.forEach((l, i) => {
      const d = Math.hypot(l.x - x, l.y - y);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  };

  Wheel.prototype._down = function (e) {
    if (this.pointerId !== null) return;
    if (e.target.closest && e.target.closest('.shuffle')) return;
    this.pointerId = e.pointerId;
    try { this.box.setPointerCapture(e.pointerId); } catch (err) {}
    const i = this._hit(e);
    if (i >= 0) this._pick(i);
    this._draw();
    // шлейф частиц
    const app = document.querySelector('#app');
    const ar = app.getBoundingClientRect();
    window.Particles.trail(e.clientX - ar.left, e.clientY - ar.top);
  };

  Wheel.prototype._move = function (e) {
    if (e.pointerId !== this.pointerId) return;
    const i = this._hit(e);
    if (i >= 0) {
      const pos = this.picked.indexOf(i);
      if (pos === -1) {
        this._pick(i);
      } else if (pos === this.picked.length - 2) {
        this._unpick(); // вернулись на предыдущую — отменяем последнюю
      }
    }
    this._draw();
    // шлейф частиц
    const app = document.querySelector('#app');
    const ar = app.getBoundingClientRect();
    window.Particles.trail(e.clientX - ar.left, e.clientY - ar.top);
  };

  Wheel.prototype._up = function (e) {
    if (e.pointerId !== this.pointerId) return;
    const word = this.word();
    const count = this.picked.length;
    this.reset();
    if (count > 0) this.cb.onSubmit(word);
  };

  Wheel.prototype._pick = function (i) {
    this.picked.push(i);
    this.letters[i].el.classList.add('picked');
    this.cb.onPick(this.picked.length - 1, this.word());
  };

  Wheel.prototype._unpick = function () {
    const i = this.picked.pop();
    this.letters[i].el.classList.remove('picked');
    this.cb.onUnpick(this.picked.length, this.word());
  };

  Wheel.prototype._draw = function () {
    const svg = this.trace;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (!this.picked.length) return;
    const pts = this.picked.map(i => this.letters[i].x + ',' + this.letters[i].y);
    if (this.pointerId !== null && this.pos) pts.push(this.pos.x + ',' + this.pos.y);
    const mk = (w, o) => {
      const p = document.createElementNS(NS, 'polyline');
      p.setAttribute('points', pts.join(' '));
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', '#f2b64b');
      p.setAttribute('stroke-width', w);
      p.setAttribute('stroke-opacity', o);
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(p);
    };
    mk(16, 0.18); // свечение
    mk(7, 0.85);  // ядро линии
  };

  window.Wheel = Wheel;
})();
</script>
<script>
/* Словокруг — игровой экран: сетка, проверка слов, бонусы, подсказки. */
(function () {
  'use strict';

  const $ = s => document.querySelector(s);

  const COST_LAMP = 25;
  const COST_TARGET = 50;
  const WORD_REWARD = 3;
  const BONUS_REWARD = 5;
  const WIN_REWARD = 20;

  /* ---------- общие UI-хелперы ---------- */

  let toastTimer = null;
  function toast(msg, gold) {
    const el = $('#toast');
    el.textContent = msg;
    el.className = gold ? 'gold' : '';
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.add('out');
      toastTimer = setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 240);
    }, 1400);
  }

  function refreshCoins(bumpIt) {
    const c = window.Store.state.coins;
    ['#home-coins', '#game-coins'].forEach(sel => {
      const el = $(sel);
      if (!el) return;
      el.querySelector('b').textContent = c;
      el.setAttribute('aria-label', 'Баланс: ' + c + ' монет');
      if (bumpIt) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    });
  }

  /* Монета летит по дуге из точки (x,y) в счётчик монет. */
  function flyCoin(x, y, delay, onFinish) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      if (onFinish) onFinish();
      return;
    }
    const fx = $('#fx');
    const layer = fx.getBoundingClientRect();
    const pill = $('#game-coins').getBoundingClientRect();
    const sx = x - layer.left;
    const sy = y - layer.top;
    const tx = pill.left + pill.width / 2 - layer.left - 8;
    const ty = pill.top + pill.height / 2 - layer.top - 8;
    const coin = document.createElement('div');
    coin.className = 'fly-coin';
    coin.style.left = (sx - 8) + 'px';
    coin.style.top = (sy - 8) + 'px';
    fx.appendChild(coin);
    const dx = tx - (sx - 8), dy = ty - (sy - 8);
    const anim = coin.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(.7)', opacity: 0 },
      { transform: `translate(${dx * 0.18}px, ${dy * 0.08 - 34}px) rotate(80deg) scale(1.15)`, opacity: 1, offset: 0.22 },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.28 - 64}px) rotate(220deg) scale(1.3)`, opacity: 1, offset: 0.5 },
      { transform: `translate(${dx}px, ${dy}px) rotate(540deg) scale(.45)`, opacity: 0.92 },
    ], { duration: 650, delay: delay || 0, easing: 'cubic-bezier(.22,.72,.32,1)', fill: 'backwards' });
    anim.onfinish = () => {
      coin.remove();
      if (onFinish) onFinish();
    };
  }

  function animateCoinReward(x, y, amount, particleCount, startDelay) {
    const generation = Game.gen;
    const fx = $('#fx');
    const count = Math.max(1, Math.min(particleCount || 3, amount));
    const label = document.createElement('div');
    label.className = 'coin-reward';
    label.setAttribute('aria-hidden', 'true');
    label.textContent = '+' + amount;
    const layer = fx.getBoundingClientRect();
    label.style.left = (x - layer.left) + 'px';
    label.style.top = (y - layer.top) + 'px';
    fx.appendChild(label);
    setTimeout(() => label.remove(), 1000 + (startDelay || 0));

    let arrived = 0;
    const pill = $('#game-coins');
    pill.classList.add('rewarding');
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
      const spread = count === 1 ? 0 : 10;
      flyCoin(
        x + Math.cos(angle) * spread,
        y + Math.sin(angle) * spread,
        (startDelay || 0) + i * 85,
        () => {
          if (generation !== Game.gen) return;
          arrived++;
          window.SFX.coin();
          if (arrived === count) {
            pill.classList.remove('rewarding');
            refreshCoins(true);
            updateHintButtons();
          }
        },
      );
    }
  }

  window.UIH = { toast, refreshCoins, animateCoinReward };

  /* ---------- игра ---------- */

  const Game = {
    idx: 0,
    gen: 0,             // поколение уровня: инвалидирует отложенные таймеры при смене уровня
    level: null,
    saved: null,
    cells: new Map(),   // "x,y" -> { x, y, ch, el, open }
    words: [],          // { w, x, y, d, cells[], found }
    wheelCounts: null,
    wheel: null,
    targetMode: false,
    finished: false,
    runRewards: null,
    coachAnim: null,   // анимация обучающего «пальца» (первый запуск)
  };

  function key(x, y) { return x + ',' + y; }

  /* setTimeout, который молча не срабатывает, если уровень уже сменился. */
  function later(fn, ms) {
    const g = Game.gen;
    return setTimeout(() => { if (g === Game.gen) fn(); }, ms);
  }

  function counts(word) {
    const m = {};
    for (const ch of word) m[ch] = (m[ch] || 0) + 1;
    return m;
  }

  function canFormFromWheel(word) {
    const need = counts(word);
    for (const ch in need) if (!Game.wheelCounts[ch] || Game.wheelCounts[ch] < need[ch]) return false;
    return true;
  }

  Game.init = function () {
    Game.wheel = new window.Wheel($('#wheel-box'), $('#trace'), {
      onPick(i, word) {
        if (!window.Store.state.seenIntro) hideCoach(true); // тронул букву — понял, как играть
        window.SFX.pick(i);
        window.HAPTIC.tap();
        renderPreview(word);
      },
      onUnpick(i, word) {
        window.SFX.unpick(i);
        renderPreview(word);
      },
      onSubmit(word) { submit(word); },
    });

    window.Particles.init($('#particles-canvas'));
    window.Combo.init($('#combo-indicator'));

    $('#btn-shuffle').addEventListener('click', () => {
      window.SFX.click();
      Game.wheel.shuffle();
      if (!window.Store.state.seenIntro) maybeShowCoach(); // пересобрать путь «пальца» под новую раскладку
    });
    $('#hint-lamp').addEventListener('click', () => hintLamp());
    $('#hint-target').addEventListener('click', () => hintTargetToggle());
    $('#bonus-chip').addEventListener('click', () => {
      const list = Game.saved.bonus;
      if (!list.length) return;
      const shown = list.slice(-5).map(w => w.toUpperCase()).join(' · ');
      toast('✦ ' + shown + (list.length > 5 ? ' …' : ''), true);
    });
    $('#overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) {
        e.currentTarget.hidden = true; // посмотреть решённую сетку
        $('#btn-back').focus();
      }
    });
    $('#grid').addEventListener('click', onGridTap);
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || $('#game').hidden) return;
      const overlay = $('#overlay');
      if (!overlay.hidden) {
        overlay.hidden = true;
        $('#btn-back').focus();
        e.preventDefault();
      } else if (Game.targetMode) {
        setTargetMode(false);
        $('#hint-target').focus();
        e.preventDefault();
      }
    });
    window.addEventListener('resize', () => {
      if (!Game.level || $('#game').hidden) return;
      layoutGrid();
      Game.wheel.refresh();
      if (!window.Store.state.seenIntro) maybeShowCoach();
    });
  };

  Game.open = function (idx) {
    Game.gen++;
    Game.idx = idx;
    Game.level = window.SK_LEVELS[idx];
    Game.saved = window.Store.level(idx);
    Game.finished = false;
    Game.runRewards = { grid: 0, bonus: 0 };
    Game.targetMode = false;
    window.Combo.levelReset();
    $('#hint-target').classList.remove('armed');
    $('#hint-target').setAttribute('aria-pressed', 'false');

    $('#lvl-title').textContent = 'Уровень ' + (idx + 1);
    refreshCoins();

    // сетка
    const grid = $('#grid');
    grid.innerHTML = '';
    Game.cells = new Map();
    Game.words = Game.level.w.map(entry => {
      const [w, x, y, d] = entry;
      const wordCells = [];
      for (let i = 0; i < w.length; i++) {
        const cx = x + (d === 0 ? i : 0);
        const cy = y + (d === 1 ? i : 0);
        const k = key(cx, cy);
        let cell = Game.cells.get(k);
        if (!cell) {
          const el = document.createElement('div');
          el.className = 'cell';
          grid.appendChild(el);
          cell = { x: cx, y: cy, ch: w[i], el, open: false };
          Game.cells.set(k, cell);
        }
        wordCells.push(cell);
      }
      return { w, x, y, d, cells: wordCells, found: false };
    });

    layoutGrid();

    // колесо
    Game.wheelCounts = counts(Game.level.l.join(''));
    Game.wheel.setLetters(Game.level.l);

    // восстановление прогресса: найденные слова и купленные подсказкой буквы
    for (const fw of Game.saved.found) {
      const word = Game.words.find(x => x.w === fw && !x.found);
      if (word) { word.found = true; word.cells.forEach(c => openCell(c, true)); }
    }
    for (const hk of Game.saved.hinted) {
      const cell = Game.cells.get(hk);
      if (cell) openCell(cell, true, true);
    }
    updateLevelProgress(false);
    updateBonusChip(false);
    updateHintButtons();
    renderPreview('');

    if (Game.saved.done && allFound()) {
      // пройденный уровень: показываем решённую сетку и сразу оверлей
      later(() => showOverlay(true), 350);
    } else {
      maybeShowCoach();
    }
  };

  /* Выход с игрового экрана: гасим все отложенные таймеры уровня. */
  Game.close = function () {
    Game.gen++;
    setTargetMode(false);
    hideCoach(false); // подсказку не «засчитываем», если игрок ушёл, не тронув буквы
    window.Combo.levelReset();
    $('#fx').replaceChildren();
    $('#game-coins').classList.remove('rewarding');
    refreshCoins();
  };

  function layoutGrid() {
    const wrap = $('#grid-wrap');
    const grid = $('#grid');
    const cellsArr = [...Game.cells.values()];
    if (!cellsArr.length) return;
    const cols = Math.max(...cellsArr.map(c => c.x)) + 1;
    const rows = Math.max(...cellsArr.map(c => c.y)) + 1;
    const gap = 4;
    const availW = wrap.clientWidth - 8;
    const availH = wrap.clientHeight - 8;
    const cell = Math.max(14, Math.min(
      cols <= 5 && rows <= 5 ? 58 : 52,
      Math.floor((availW - (cols - 1) * gap) / cols),
      Math.floor((availH - (rows - 1) * gap) / rows)
    ));
    grid.style.setProperty('--cell', cell + 'px');
    grid.style.width = (cols * cell + (cols - 1) * gap) + 'px';
    grid.style.height = (rows * cell + (rows - 1) * gap) + 'px';
    for (const c of cellsArr) {
      c.el.style.left = (c.x * (cell + gap)) + 'px';
      c.el.style.top = (c.y * (cell + gap)) + 'px';
    }
  }

  function openCell(cell, instant, hinted) {
    if (cell.open) return;
    cell.open = true;
    cell.el.textContent = cell.ch.toUpperCase();
    cell.el.classList.remove('target-mode');
    if (hinted) cell.el.classList.add('hinted');
    if (instant) {
      cell.el.style.animation = 'none';
      cell.el.classList.add('open');
    } else {
      cell.el.classList.add('open');
    }
  }

  function glowCell(cell) {
    cell.el.classList.remove('glow');
    void cell.el.offsetWidth;
    cell.el.classList.add('glow');
  }

  function allFound() { return Game.words.every(w => w.found); }

  function updateLevelProgress(bumpIt) {
    const found = Game.words.filter(w => w.found).length;
    const total = Game.words.length;
    const progress = $('#lvl-progress');
    const row = progress.parentElement;
    progress.textContent = found + ' / ' + total + ' слов';
    progress.setAttribute('aria-label', 'Найдено ' + found + ' из ' + total + ' слов');
    $('#lvl-progress-fill').style.width = (total ? found / total * 100 : 0) + '%';
    if (bumpIt) {
      row.classList.remove('bump');
      void row.offsetWidth;
      row.classList.add('bump');
    }
  }

  let pvTimer = null;

  function renderPreview(word) {
    clearTimeout(pvTimer);
    const pv = $('#preview');
    pv.className = 'preview' + (word.length >= 7 ? ' long' : '');
    pv.innerHTML = '';
    pv.setAttribute('aria-label', word ? 'Собрано: ' + word.toUpperCase() : 'Слово не набрано');
    for (const ch of word) {
      const t = document.createElement('div');
      t.className = 'pv-tile';
      t.textContent = ch.toUpperCase();
      t.setAttribute('aria-hidden', 'true');
      pv.appendChild(t);
    }
    // во время набора слова прячем бонус-фишку, чтобы не наезжала на плитки
    $('#bonus-chip').classList.toggle('faded', word.length > 0);
  }

  function previewOut(cls) {
    const pv = $('#preview');
    pv.classList.add(cls);
    clearTimeout(pvTimer);
    pvTimer = setTimeout(() => renderPreview(''), cls === 'shake' ? 420 : 320);
  }

  /* ---------- обучающая подсказка (только при самом первом запуске) ---------- */

  function maybeShowCoach() {
    if (window.Store.state.seenIntro) return;
    const ls = Game.wheel && Game.wheel.letters;
    const order = Game.wheel && Game.wheel.order;
    if (!ls || !ls.length || !order) return;

    $('#coach-tip').hidden = false;

    // при системной «меньше движения» показываем только подпись, без бегающего пальца
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const hand = $('#coach-hand');
    if (reduce) {
      if (Game.coachAnim) { Game.coachAnim.cancel(); Game.coachAnim = null; }
      hand.hidden = true;
      return;
    }

    // короткий путь по трём соседним буквам на окружности — демонстрация жеста
    const slots = [0, 1, 2].slice(0, Math.min(3, ls.length));
    const pts = slots.map(s => ls[order[s]]);
    const at = p => `translate(${p.x}px, ${p.y}px)`;
    const frames = [{ transform: at(pts[0]) + ' scale(.5)', opacity: 0 }];
    frames.push({ transform: at(pts[0]) + ' scale(1)', opacity: 1, offset: 0.10 });
    for (let i = 1; i < pts.length; i++) {
      frames.push({ transform: at(pts[i]) + ' scale(1)', opacity: 1, offset: 0.10 + 0.70 * (i / (pts.length - 1)) });
    }
    frames.push({ transform: at(pts[pts.length - 1]) + ' scale(1)', opacity: 1, offset: 0.90 });
    frames.push({ transform: at(pts[pts.length - 1]) + ' scale(.5)', opacity: 0 });

    hand.hidden = false;
    if (Game.coachAnim) Game.coachAnim.cancel();
    Game.coachAnim = hand.animate(frames, { duration: 2200, iterations: Infinity, easing: 'cubic-bezier(.4,.1,.3,1)' });
  }

  function hideCoach(markSeen) {
    if (Game.coachAnim) { Game.coachAnim.cancel(); Game.coachAnim = null; }
    $('#coach-tip').hidden = true;
    $('#coach-hand').hidden = true;
    if (markSeen && !window.Store.state.seenIntro) window.Store.setIntroSeen();
  }

  /* ---------- проверка собранного слова ---------- */

  function submit(word) {
    if (word.length < 2) { renderPreview(''); return; }

    const gridWord = Game.words.find(x => x.w === word);
    if (gridWord) {
      if (gridWord.found) {
        window.SFX.dup();
        toast('Уже найдено');
        previewOut('dissolve');
      } else {
        window.Combo.grow();
        foundWord(gridWord);
        previewOut('absorb');
      }
      return;
    }

    if (word.length >= 3 && window.SK_DICT.has(word) && canFormFromWheel(word)) {
      if (Game.saved.bonus.includes(word)) {
        window.SFX.dup();
        toast('Бонус уже найден');
        previewOut('dissolve');
      } else {
        Game.saved.bonus.push(word);
        window.Store.refreshStars(Game.saved);
        window.Combo.grow();
        const reward = BONUS_REWARD * window.Combo.multiplier;
        Game.runRewards.bonus += reward;
        window.Store.addCoins(reward);
        window.SFX.bonus();
        window.HAPTIC.ok();
        const comboLabel = window.Combo.multiplier > 1 ? ' ×' + window.Combo.multiplier : '';
        toast('✦ ' + word.toUpperCase() + '  +' + reward + comboLabel, true);
        updateBonusChip(true);
        updateHintButtons();
        const pv = $('#preview').getBoundingClientRect();
        animateCoinReward(pv.left + pv.width / 2, pv.top + pv.height / 2, reward, 4, 100);
        previewOut('absorb');
      }
      return;
    }

    // Невалидное слово — сброс комбо
    window.Combo.reset();
    window.SFX.invalid();
    window.HAPTIC.no();
    previewOut('shake');
  }

  function foundWord(gridWord) {
    gridWord.found = true;
    Game.saved.found.push(gridWord.w);
    const reward = WORD_REWARD * window.Combo.multiplier;
    Game.runRewards.grid += reward;
    window.Store.addCoins(reward);
    updateLevelProgress(true);
    updateHintButtons();
    window.SFX.word(gridWord.w.length);
    window.HAPTIC.ok();
    const boxes = gridWord.cells.map(c => c.el.getBoundingClientRect());
    const origin = boxes.reduce(
      (point, box) => ({ x: point.x + box.left + box.width / 2, y: point.y + box.top + box.height / 2 }),
      { x: 0, y: 0 },
    );
    origin.x /= boxes.length;
    origin.y /= boxes.length;
    // взрыв частиц из центра слова
    window.Particles.burst(origin.x, origin.y, 14);
    gridWord.cells.forEach((c, i) => {
      later(() => {
        if (c.open) glowCell(c); else openCell(c);
      }, i * 45);
    });
    animateCoinReward(origin.x, origin.y, reward, 3, gridWord.cells.length * 45 + 80);
    // открытая буква могла достроить другие слова
    later(() => checkAutoComplete(), gridWord.cells.length * 45 + 60);
  }

  /* Слова, у которых открылись все клетки (через пересечения или подсказки), считаются найденными. */
  function checkAutoComplete() {
    let extra = 0;
    for (const w of Game.words) {
      if (!w.found && w.cells.every(c => c.open)) {
        w.found = true;
        Game.saved.found.push(w.w);
        w.cells.forEach(glowCell);
        extra++;
      }
    }
    if (extra) {
      updateLevelProgress(true);
      window.Store.save();
      window.SFX.word(3);
    }
    updateHintButtons();
    if (allFound() && !Game.finished) {
      Game.finished = true;
      later(levelComplete, 1050);
    }
  }

  function levelComplete() {
    const first = !Game.saved.done;
    Game.saved.done = true;
    Game.saved.stars = window.Store.starsFor(Game.saved);
    if (first) window.Store.addCoins(WIN_REWARD);
    window.Store.save();
    window.SFX.win();
    window.HAPTIC.ok();
    refreshCoins(true);
    showOverlay(false, first);
  }

  function showOverlay(replay, rewarded) {
    const ov = $('#overlay');
    const last = Game.idx + 1 >= window.SK_LEVELS.length;
    $('#ov-kicker').textContent = last ? 'игра пройдена' : replay ? 'уровень пройден ранее' : 'уровень пройден';
    $('#ov-title').textContent = last ? 'Триумф!' : ['Отлично!', 'Блестяще!', 'Превосходно!', 'Мастерски!'][Game.idx % 4];
    const stars = Game.saved.stars || 1;
    const starBox = $('#ov-stars');
    starBox.innerHTML = '';
    starBox.setAttribute('aria-label', 'Получено звёзд: ' + stars + ' из 3');
    for (let i = 0; i < 3; i++) {
      const star = document.createElement('span');
      star.className = 'overlay-star' + (i < stars ? ' earned' : '');
      star.textContent = '★';
      star.setAttribute('aria-hidden', 'true');
      if (i < stars) star.style.setProperty('--star-delay', (i * 120) + 'ms');
      starBox.appendChild(star);
    }
    const bonus = Game.saved.bonus.length;
    $('#ov-stats').textContent = replay
      ? 'Ранее получено: ' + stars + ' из 3 звёзд.'
      : 'Получено: ' + stars + ' из 3 звёзд.';
    const rewards = $('#ov-rewards');
    rewards.hidden = replay;
    if (!replay) {
      const grid = Game.runRewards.grid;
      const bonusReward = Game.runRewards.bonus;
      const firstReward = rewarded ? WIN_REWARD : 0;
      $('#ov-grid-reward').innerHTML = 'Слова сетки <b>+' + grid + '</b>';
      $('#ov-bonus-reward').innerHTML = 'Бонусные слова (' + bonus + ') <b>+' + bonusReward + '</b>';
      $('#ov-first-reward').innerHTML = 'За первое прохождение <b>+' + firstReward + '</b>';
      $('#ov-total-reward').innerHTML = 'Итого за этот проход <b>+' + (grid + bonusReward + firstReward) + '</b>';
    }
    $('#ov-next').textContent = last ? 'К уровням' : 'Дальше';
    $('#ov-home').hidden = last;
    ov.hidden = false;
    $('#ov-next').focus();
    // перезапуск золотой волны
    const pulse = ov.querySelector('.overlay-pulse');
    pulse.style.animation = 'none';
    void pulse.offsetWidth;
    pulse.style.animation = '';
  }

  /* ---------- подсказки ---------- */

  function closedCells() {
    return [...Game.cells.values()].filter(c => !c.open);
  }

  function updateHintButtons() {
    const empty = closedCells().length === 0;
    const c = window.Store.state.coins;
    const lampDisabled = empty || c < COST_LAMP;
    const targetDisabled = empty || c < COST_TARGET;
    $('#hint-lamp').classList.toggle('disabled', lampDisabled);
    $('#hint-lamp').setAttribute('aria-disabled', String(lampDisabled));
    $('#hint-target').classList.toggle('disabled', targetDisabled);
    $('#hint-target').setAttribute('aria-disabled', String(targetDisabled));
  }

  function hintLamp() {
    const pool = closedCells();
    if (!pool.length) return;
    if (window.Store.state.coins < COST_LAMP) { toast('Недостаточно монет'); window.SFX.invalid(); return; }
    window.Store.addCoins(-COST_LAMP);
    refreshCoins(true);
    const cell = pool[Math.floor(Math.random() * pool.length)];
    revealHint(cell);
  }

  function hintTargetToggle() {
    if (Game.targetMode) { setTargetMode(false); return; }
    const pool = closedCells();
    if (!pool.length) return;
    if (window.Store.state.coins < COST_TARGET) { toast('Недостаточно монет'); window.SFX.invalid(); return; }
    setTargetMode(true);
    toast('Выберите ячейку');
    window.SFX.click();
  }

  function setTargetMode(on) {
    Game.targetMode = on;
    $('#hint-target').classList.toggle('armed', on);
    $('#hint-target').setAttribute('aria-pressed', String(on));
    closedCells().forEach(c => c.el.classList.toggle('target-mode', on));
    if (!on) [...Game.cells.values()].forEach(c => c.el.classList.remove('target-mode'));
  }

  /* Тап по сетке в режиме «мишень»: берём ближайшую закрытую клетку,
   * чтобы промах в 4-пиксельный зазор не открывал соседнюю. */
  function onGridTap(e) {
    // Тултип: если кликнули мимо него — скрываем.
    const tooltip = $('#word-tooltip');
    if (!tooltip.hidden && !tooltip.contains(e.target)) {
      hideDefinition();
    }

    if (!Game.targetMode) {
      // Проверяем клик по найденному слову для показа определения
      const cellEl = e.target.closest('.cell');
      if (cellEl && cellEl.classList.contains('open')) {
        for (const word of Game.words) {
          if (!word.found) continue;
          if (word.cells.some(c => c.el === cellEl)) {
            showDefinition(word);
            return;
          }
        }
      }
      return;
    }
    let best = null, bestD = Infinity;
    for (const c of closedCells()) {
      const r = c.el.getBoundingClientRect();
      const d = Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - e.clientY);
      if (d < bestD) { bestD = d; best = c; }
    }
    if (!best) return;
    const size = best.el.offsetWidth || 40;
    if (bestD > size * 1.1) return; // слишком далеко — не считаем выбором
    if (window.Store.state.coins < COST_TARGET) { setTargetMode(false); toast('Недостаточно монет'); return; }
    window.Store.addCoins(-COST_TARGET);
    refreshCoins(true);
    setTargetMode(false);
    revealHint(best);
  }

  function revealHint(cell) {
    window.SFX.hint();
    openCell(cell, false, true);
    Game.saved.hinted.push(key(cell.x, cell.y));
    window.Store.save();
    later(() => checkAutoComplete(), 350);
  }

  function updateBonusChip(bump) {
    const chip = $('#bonus-chip');
    const n = Game.saved.bonus.length;
    chip.hidden = n === 0;
    chip.querySelector('b').textContent = n;
    chip.setAttribute('aria-label', 'Бонусных слов: ' + n);
    if (bump) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
    window.Store.save();
  }

  window.Game = Game;

  /* ---------- тултип значения слова ---------- */

  function showDefinition(word) {
    const def = window.SK_DEFINITIONS && window.SK_DEFINITIONS[word.w];
    if (!def) return;

    const tooltip = $('#word-tooltip');
    tooltip.querySelector('.tooltip-word').textContent = word.w.toUpperCase();
    tooltip.querySelector('.tooltip-def').textContent = def;
    tooltip.hidden = false;
    tooltip.classList.remove('is-hiding', 'is-visible');

    // Позиция: по центру слова, сдвиг вверх. Сначала показываем элемент,
    // чтобы его размеры были доступны для точного расчёта.
    const boxes = word.cells.map(c => c.el.getBoundingClientRect());
    const cx = boxes.reduce((s, b) => s + b.left + b.width / 2, 0) / boxes.length;
    const cy = boxes.reduce((s, b) => s + b.top + b.height / 2, 0) / boxes.length;
    const appRect = $('#app').getBoundingClientRect();
    const top = cy - appRect.top - tooltip.offsetHeight - 12;
    const left = cx - appRect.left - tooltip.offsetWidth / 2;
    const clampedLeft = Math.max(8, Math.min(left, appRect.width - tooltip.offsetWidth - 8));

    tooltip.style.top = Math.max(4, top) + 'px';
    tooltip.style.left = clampedLeft + 'px';
    void tooltip.offsetWidth; // фиксируем начальное состояние для анимации появления
    tooltip.classList.add('is-visible');

    window.SFX.click();
  }

  function hideDefinition() {
    const tooltip = $('#word-tooltip');
    if (tooltip.hidden || tooltip.classList.contains('is-hiding')) return;
    tooltip.classList.remove('is-visible');
    tooltip.classList.add('is-hiding');
    window.setTimeout(() => {
      if (!tooltip.classList.contains('is-visible')) {
        tooltip.hidden = true;
        tooltip.classList.remove('is-hiding');
      }
    }, 180);
  }

  // Тап по любой области подсказки (включая кнопку ×) закрывает её.
  $('#word-tooltip').addEventListener('click', hideDefinition);
})();
</script>
<script>
/* Словокруг — экраны, выбор уровня, звук, блокировка жестов. */
(function () {
  'use strict';

  const $ = s => document.querySelector(s);

  const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  function renderSound() {
    const on = window.Store.state.sound;
    ['#home-sound', '#btn-sound'].forEach(sel => {
      const b = $(sel);
      b.innerHTML = on ? ICON_ON : ICON_OFF;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', on ? 'Выключить звук' : 'Включить звук');
    });
    window.SFX.setEnabled(on);
  }

  function toggleSound() {
    window.Store.setSound(!window.Store.state.sound);
    renderSound();
    window.SFX.click();
  }

  function show(id) {
    ['#home', '#game'].forEach(sel => {
      const el = $(sel);
      const on = sel === id;
      if (on === !el.hidden) return;
      el.hidden = !on;
      if (on) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
    });
  }

  function renderHome() {
    window.UIH.refreshCoins();
    const doneCount = Object.values(window.Store.state.levels).filter(l => l.done).length;
    $('#home-progress').textContent = doneCount
      ? 'пройдено ' + doneCount + ' из ' + window.SK_LEVELS.length
      : window.SK_LEVELS.length + ' уровней';
    const box = $('#levels');
    box.innerHTML = '';
    window.SK_LEVELS.forEach((level, i) => {
      const st = window.Store.state.levels[i];
      const b = document.createElement('button');
      b.className = 'lvl' + (st && st.done ? ' done' : (st && st.found && st.found.length ? ' started' : ''));
      b.append(document.createTextNode(i + 1));
      const stars = st && st.done ? (st.stars || 1) : 0;
      if (stars) {
        const mark = document.createElement('span');
        mark.className = 'lvl-stars';
        mark.textContent = '★'.repeat(stars);
        mark.setAttribute('aria-hidden', 'true');
        b.appendChild(mark);
      }
      const stateLabel = st && st.done
        ? 'пройден'
        : st && st.found && st.found.length
          ? 'найдено ' + st.found.length + ' из ' + level.w.length + ' слов'
          : 'не начат';
      b.setAttribute('aria-label', 'Уровень ' + (i + 1) + ', ' + stateLabel + (stars ? ', ' + stars + ' ' + (stars === 1 ? 'звезда' : 'звезды') : ''));
      b.addEventListener('click', () => {
        window.SFX.click();
        openLevel(i);
      });
      box.appendChild(b);
    });
  }

  function openLevel(i) {
    show('#game');
    window.Game.open(i);
    $('#btn-back').focus({ preventScroll: true });
  }

  function goHome() {
    const previous = window.Game.idx;
    window.Game.close(); // гасит отложенные таймеры уровня
    $('#overlay').hidden = true;
    renderHome();
    show('#home');
    const levelButton = $('#levels').children[previous];
    if (levelButton) levelButton.focus({ preventScroll: true });
  }

  function init() {
    renderSound();
    renderHome();
    window.Game.init();

    $('#home-sound').addEventListener('click', toggleSound);
    $('#btn-sound').addEventListener('click', toggleSound);
    $('#btn-back').addEventListener('click', () => { window.SFX.click(); goHome(); });

    $('#ov-home').addEventListener('click', () => { window.SFX.click(); goHome(); });
    $('#ov-next').addEventListener('click', () => {
      window.SFX.click();
      $('#overlay').hidden = true;
      const next = window.Game.idx + 1;
      if (next < window.SK_LEVELS.length) openLevel(next);
      else goHome();
    });

    // разблокировка/возобновление аудио жестами (включая iOS-состояние interrupted)
    const unlock = () => window.SFX.unlock();
    document.addEventListener('pointerdown', unlock);
    document.addEventListener('touchend', unlock);
    document.addEventListener('click', unlock);

    // никакого скролла, зума и контекстных меню
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
